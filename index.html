<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARBAS — seu mordomo</title>
<link rel="stylesheet" href="styles/fontes.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/views.css">
<link rel="preload" as="font" type="font/woff2" href="assets/fontes/montserrat-700-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fontes/figtree-400-latin.woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1519">
<meta name="application-name" content="JARBAS">
<!-- iPhone: sem estas quatro linhas, "Adicionar à Tela de Início" abre uma
     aba do Safari com barra de endereço, em vez de um aplicativo. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARBAS">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icone-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%23bcceda' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%23bcceda'/></svg>">
</head>
<body>
  <div class="fx-grid" aria-hidden="true"></div>
  <div class="fx-glow" aria-hidden="true"></div>

  <div id="boot" class="boot">
    <div class="boot-ring"><span></span><span></span><span></span></div>
    <div class="boot-mark">J A R B A S</div>
    <div class="boot-status" id="boot-status">inicializando núcleo…</div>
  </div>

  <div id="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-core"></span>
        <div>
          <div class="brand-text">JARBAS</div>
          <div class="brand-sub">ao seu dispor</div>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Seções"></nav>
      <div class="sidebar-foot">
        <button class="sync-chip" id="sync-chip" title="Estado da sincronização">
          <span class="sync-dot"></span><span class="sync-label">local</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu">☰</button>
          <h1 id="view-title">Painel</h1>
          <span class="topbar-clock" id="clock"></span>
        </div>
        <div class="topbar-right">
          <button class="ghost-btn" id="btn-palette" title="Busca rápida (Ctrl+K)">
            <span>Buscar</span><kbd>Ctrl</kbd><kbd>K</kbd>
          </button>
          <button class="icon-btn" id="btn-jarbas" title="JARBAS (Ctrl+J)" aria-label="Abrir JARBAS">◈</button>
        </div>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>

    <section id="jarbas" class="jarbas" aria-label="JARBAS — assistente">
      <header class="jarbas-head">
        <div class="jarbas-id">
          <canvas id="jarbas-face" class="jarbas-face" width="132" height="160" aria-hidden="true"></canvas>
          <div>
            <div class="jarbas-name">JARBAS</div>
            <div class="jarbas-state" id="jarbas-state">em espera</div>
          </div>
        </div>
        <div class="jarbas-actions">
          <button class="icon-btn sm" id="jarbas-voice-toggle" title="Escuta contínua (palavra-chave “Jarbas”)" aria-pressed="false">🎙</button>
          <button class="icon-btn sm" id="jarbas-speak-toggle" title="Falar as respostas" aria-pressed="true">🔊</button>
          <button class="icon-btn sm" id="jarbas-clear" title="Nova conversa">⟳</button>
          <button class="icon-btn sm" id="jarbas-close" title="Fechar">✕</button>
        </div>
      </header>

      <div id="jarbas-log" class="jarbas-log" aria-live="polite"></div>

      <div id="jarbas-heard" class="jarbas-heard" hidden></div>
      <div id="jarbas-suggest" class="jarbas-suggest"></div>

      <form id="jarbas-form" class="jarbas-form">
        <button type="button" class="mic-btn" id="jarbas-mic" title="Segure para falar (Ctrl+Espaço)" aria-label="Falar">
          <span class="mic-wave"></span>🎤
        </button>
        <textarea id="jarbas-input" rows="1" placeholder="Pergunte, peça ou mande fazer…"></textarea>
        <button type="submit" class="send-btn" title="Enviar">↑</button>
      </form>
    </section>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script>
    /* Rede de segurança do boot.
     *
     * Script clássico e em sintaxe antiga de propósito: se o navegador for
     * velho demais para o resto do app, esta parte ainda precisa rodar. Ela é
     * a única coisa entre uma falha de carregamento e uma tela preta muda.
     *
     * No PC uma falha dessas aparece no console. No iPhone não aparece em lugar
     * nenhum: o app simplesmente não abre, e não há como saber por quê. Foi
     * exatamente o que aconteceu com um lookbehind de regex, que o Safari
     * anterior ao 16.4 recusa ao ler o arquivo e derruba tudo o que o importa.
     */
    (function () {
      var falhou = false;

      function mostrar(titulo, detalhe) {
        if (falhou) return;
        falhou = true;
        var boot = document.getElementById('boot');
        if (!boot) return;
        var anel = boot.querySelector('.boot-ring');
        if (anel) anel.style.display = 'none';
        var caixa = document.createElement('div');
        caixa.style.cssText = 'max-width:640px;margin:18px auto 0;padding:16px;text-align:left;'
          + 'border:1px solid #7a4a2a;border-radius:10px;background:rgba(120,70,20,.16);'
          + 'color:#e6d5c2;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;word-break:break-word';
        caixa.innerHTML = '<div style="font-weight:700;margin-bottom:8px">' + titulo + '</div>'
          + '<div style="margin-bottom:10px">' + detalhe + '</div>'
          + '<div style="opacity:.6;font-size:11px">' + navigator.userAgent + '</div>'
          + '<div style="opacity:.6;font-size:11px;margin-top:8px">'
          + 'Tire um print desta tela: é ela que diz o que falhou.</div>';
        boot.appendChild(caixa);
        var s = document.getElementById('boot-status');
        if (s) s.textContent = 'o núcleo não subiu';
      }

      function escapar(t) {
        return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      window.addEventListener('error', function (e) {
        var onde = e.filename ? escapar(e.filename) + ':' + e.lineno : 'origem desconhecida';
        mostrar('Falha ao carregar o JARBAS', escapar(e.message || 'erro sem mensagem') + '<br>' + onde);
      });

      window.addEventListener('unhandledrejection', function (e) {
        mostrar('Falha ao iniciar o JARBAS', escapar((e.reason && e.reason.message) || e.reason || 'promessa rejeitada'));
      });

      // O caso mudo: nenhum evento de erro, e mesmo assim o app não apareceu.
      setTimeout(function () {
        var app = document.getElementById('app');
        if (app && app.hasAttribute('hidden')) {
          mostrar('O JARBAS não terminou de abrir',
            'Passaram-se 12 segundos e o núcleo não assumiu a tela. '
            + 'Costuma ser um arquivo que não chegou (rede) ou um recurso que este '
            + 'navegador não tem. No iPhone, o Safari precisa ser 16.4 ou mais novo.');
        }
      }, 12000);
    }());
  </script>

  <script type="module" src="app/main.js"></script>

  <script>
    // Registra o service worker: é ele que faz o JARBAS abrir instalado, com o
    // servidor local desligado. Em file:// não existe, e tudo bem — o hub roda igual.
    //
    // Como o cache responde antes da rede, uma versão nova publicada só apareceria
    // na segunda vez que o app abrisse. Em vez de deixar você fechar e abrir de novo
    // sem saber por quê, avisamos na tela e recarregamos quando você mandar.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      addEventListener('load', async () => {
        let reg;
        try {
          reg = await navigator.serviceWorker.register('sw.js');
        } catch { return; }

        const avisar = () => {
          if (document.getElementById('update-bar')) return;
          const bar = document.createElement('div');
          bar.id = 'update-bar';
          bar.className = 'update-bar';
          bar.innerHTML = '<span>Uma versão nova do JARBAS está pronta.</span>';
          const btn = document.createElement('button');
          btn.textContent = 'Atualizar agora';
          btn.onclick = () => location.reload();
          const depois = document.createElement('button');
          depois.className = 'ghost';
          depois.textContent = 'depois';
          depois.onclick = () => bar.remove();
          bar.append(btn, depois);
          document.body.append(bar);
        };

        // Já existia um worker no comando: então esta é uma atualização, não a
        // primeira instalação — e aí sim vale avisar.
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.addEventListener('controllerchange', avisar);
          reg.addEventListener('updatefound', () => {
            const novo = reg.installing;
            novo?.addEventListener('statechange', () => {
              if (novo.state === 'installed') avisar();
            });
          });
        }

        // Procura versão nova ao abrir e ao voltar para a aba.
        reg.update().catch(() => {});
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      });
    }
  </script>
</body>
</html>
